<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#05342F">
<title>Admin | FreshNest Cleaning Services</title>
<link rel="icon" href="../favicon.ico" sizes="48x48">
<link rel="icon" href="../img/favicon-32.png" type="image/png" sizes="32x32">
<script src="../js/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/site.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="adm-body page-admin">
<div id="adApp" class="adm">
  <section class="ad-login" id="adLogin" hidden>
    <form class="ad-login-card" id="adLoginForm" novalidate autocomplete="on">
      <span class="lockup compact" style="--lk:56px"><span class="lk-emblem"><img src="../img/logo-mark-128.webp" width="128" height="128" alt=""></span><span class="lk-text"><span class="lk-word"><img class="lt" src="../img/logo-word.webp" width="777" height="139" alt="FreshNest"><img class="dt" src="../img/logo-word-light.webp" width="777" height="139" alt=""></span></span></span>
      <h1>Admin sign in</h1>
      <p class="muted">Manage bookings, receipts, checklists, prices and content.</p>
      <div class="field"><label for="adUser">Username</label><input id="adUser" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
      <div class="field"><label for="adPw">Password</label><div class="pw-wrap"><input id="adPw" type="password" autocomplete="current-password" required><button type="button" class="link-inline" id="adShowPw" aria-pressed="false">Show</button></div></div>
      <div class="err" id="adLoginErr" role="alert"></div>
      <button class="btn btn-brand btn-block" type="submit" id="adLoginBtn">Sign in</button>
      <p class="fine" id="adDemoHint" hidden></p>
      <a class="fine" href="../index.html">Back to the website</a>
    </form>
  </section>
  <div class="ad-shell" id="adShell" hidden>
    <aside class="ad-side" id="adSide">
      <a class="ad-brand" href="../index.html" title="View website"><span class="lockup compact on-deep" style="--lk:40px"><span class="lk-emblem"><img src="../img/logo-mark-128.webp" width="128" height="128" alt=""></span><span class="lk-text"><span class="lk-word"><img class="lt" src="../img/logo-word.webp" width="777" height="139" alt="FreshNest"><img class="dt" src="../img/logo-word-light.webp" width="777" height="139" alt=""></span></span></span><small>Admin</small></a>
      <nav class="ad-nav" id="adNav" aria-label="Admin sections"></nav>
      <div class="ad-side-foot"><a class="fine" href="../index.html" target="_blank" rel="noopener">View website</a></div>
    </aside>
    <div class="ad-main">
      <header class="ad-top">
        <h1 id="adTitle">Overview</h1>
        <div class="ad-top-actions">
          <div class="ad-bell-wrap"><button class="icon-btn" id="adBell" type="button" aria-label="Notifications" aria-expanded="false">Alerts<i class="ad-badge" id="adBadge" hidden>0</i></button><div class="ad-pop" id="adPop" hidden></div></div>
          <button class="icon-btn theme-toggle" id="adTheme" type="button" aria-label="Switch to night mode"><span class="tt-label">Night</span></button>
          <button class="btn btn-ghost btn-sm" id="adLogout" type="button">Sign out</button>
        </div>
      </header>
      <div class="ad-warn" id="adWarn" hidden></div>
      <main class="ad-view" id="adView" tabindex="-1"></main>
    </div>
    <nav class="ad-tabbar" id="adTabbar" aria-label="Admin sections"></nav>
  </div>
  <dialog class="reader ad-dlg" id="adDlg"><div id="adDlgBody"></div></dialog>
  <div class="toast" id="adToast" role="status" aria-live="polite"></div>
</div>
<script src="../js/pricing.js"></script>
<script src="../js/hours.js"></script>
<script src="../js/docs.js"></script>
<script src="../js/manual.js"></script>
<script src="../js/planner.js"></script>
<script src="../js/api.js"></script>
<script src="../js/admin.js"></script>
</body>
</html>
